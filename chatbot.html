<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANISHKA AI | Master Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="chat-body">

    <div class="chat-interface">
        <nav class="chat-nav">
            <div class="bot-identity">
                <div class="bot-avatar">K</div>
                <div>
                    <h3>KANISHKA AI</h3>
                    <small>Online | Ready to build</small>
                </div>
            </div>
            <a href="index.html" class="exit-btn"><i class="fas fa-times"></i></a>
        </nav>

        <div id="chat-display" class="chat-display">
            <div class="bubble bot">Hi, I'm Kanishka! Welcome to the Master Hub. What are we building or solving today? 🚀</div>
        </div>

        <div id="loading" class="loading-animation">Kanishka is thinking...</div>

        <div class="chat-input-area">
            <input type="text" id="user-query" placeholder="Ask me something, bro..." autocomplete="off">
            <button id="send-query"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
